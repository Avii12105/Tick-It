{% extends "base/layout.html" %}

{% block title %}Delete {{ venue.name }} · TickIt{% endblock %}

{% block content %}
    <div class="confirm-wrap">
        <div class="confirm-card tilt">
            <h1 style="font-size: 24px;">Delete Venue</h1>
            <p>
                Are you sure you want to delete <strong>{{ venue.name }}</strong>?
                This cannot be undone.
            </p>
            <form method="post">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                <div class="form-actions">
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{{ url('events:venue_detail', venue.pk) }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
