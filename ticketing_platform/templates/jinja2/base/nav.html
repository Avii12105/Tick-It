<nav class="navbar">
  <div class="navbar-inner">

    <a class="navbar-brand" href="{{ url('events:home') }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5V9Z" stroke="#353782" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M15 7v10" stroke="#353782" stroke-width="1.8" stroke-dasharray="2 2.5" stroke-linecap="round"/>
      </svg>
      TickIt
    </a>

    <div class="nav-links">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{{ url('tickets:cart') }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5V9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          Cart
        </a>
        <a class="nav-link" href="{{ url('tickets:my_tickets') }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          My Tickets
        </a>
        {% if user.profile.is_organizer() %}
          <div class="nav-divider" aria-hidden="true"></div>
          <a class="nav-link nav-link--organizer" href="{{ url('events:organizer_event_list') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            My Events
          </a>
          <a class="nav-link nav-link--organizer" href="{{ url('events:venue_list') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 21C12 21 5 14.5 5 9.5a7 7 0 0 1 14 0C19 14.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            My Venues
          </a>
        {% endif %}
      {% else %}
        <a class="nav-link" href="{{ url('accounts:login') }}">Login</a>
        <a class="nav-link" href="{{ url('accounts:signup') }}">Sign up</a>
      {% endif %}
    </div>

    {% if user.is_authenticated %}
      <div class="nav-auth">
        <div class="nav-user">
          <span class="nav-user__name">{{ user.username }}</span>
          <span class="nav-user__role nav-user__role--{{ user.profile.role }}">{{ user.profile.get_role_display() }}</span>
        </div>
        <form method="post" action="{{ url('accounts:logout') }}" class="inline">
          {{ csrf_input }}
          <button type="submit" class="btn btn-ghost btn-sm">Logout</button>
        </form>
      </div>
    {% endif %}

  </div>
</nav>
