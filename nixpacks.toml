[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r ticketing_platform/requirements.txt"]

[phases.build]
cmds = [
  "cd ticketing_platform && python manage.py collectstatic --noinput"
]

[start]
cmd = "cd ticketing_platform && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
