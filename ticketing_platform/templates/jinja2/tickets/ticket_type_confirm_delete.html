{% extends "base/layout.html" %}

{% block title %}Delete {{ ticket_type.name }} · TickIt{% endblock %}

{% block content %}
    <div class="confirm-wrap">
        <div class="confirm-card">
            <h1 style="font-size: 24px;">Delete Ticket Tier</h1>
            <p>
                Are you sure you want to delete <strong>{{ ticket_type.name }}</strong>
                from <strong>{{ ticket_type.event.name }}</strong>? This cannot be undone.
            </p>
            <form method="post">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                <div class="form-actions">
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{{ url('events:organizer_event_detail', ticket_type.event_id) }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
